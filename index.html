<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberPrep — Kratikal Interview Preparation</title>
  <meta name="description" content="Comprehensive cybersecurity learning tool for Kratikal Tech interview preparation covering VAPT, OWASP, networking, Linux, and more.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">🛡️</div>
          <div class="logo-text">CyberPrep</div>
        </div>
        <div class="subtitle">Kratikal Interview Prep</div>
      </div>
      <div class="overall-progress">
        <div class="label">
          <span>Overall Progress</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
        </div>
        <div class="time-left">⏱️ <span id="timeLeft">~24 hrs left</span></div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <div class="nav-module-title" data-module="dashboard">
          <span class="module-num">🏠</span>
          <span>Dashboard</span>
        </div>
        <!-- Nav items will be generated by JS -->
      </nav>
    </aside>

    <!-- Main -->
    <main class="main-content">
      <div class="top-bar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="hamburger" id="hamburgerBtn">☰</button>
          <div class="breadcrumb">
            <span>CyberPrep</span>
            <span>›</span>
            <span class="current" id="breadcrumbCurrent">Dashboard</span>
          </div>
        </div>
        <div class="top-bar-actions">
          <button class="btn btn-secondary" onclick="resetProgress()">↺ Reset</button>
          <button class="btn btn-primary" id="nextModuleBtn" onclick="goNextIncomplete()">▶ Start Learning</button>
        </div>
      </div>
      <div class="content-area" id="contentArea">
        <!-- Content rendered by JS -->
      </div>
    </main>
  </div>
  <script src="app.js?v=4"></script>
  <script src="chatbot.js?v=10"></script>
</body>
</html>
